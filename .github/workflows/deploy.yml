name: Deploy Laravel to Server

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v4

      - name: 🎯 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo_mysql, zip, gd

      - name: 📦 Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install NPM dependencies
        run: npm install

      - name: 🏗️ Build assets (Vite)
        run: npm run build

      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "✅ Connected to server!"
            
            # رفتن به مسیر پروژه - مسیر درست شده
            cd /home/u573287159/domains/cardifygroup.com/public_html/api/mazorya-back
            
            # کشیدن آخرین تغییرات
            git pull origin main
            
            # نصب دیپندنسی‌های PHP
            composer install --no-dev --optimize-autoloader --no-interaction
            
            # کپی فایل env (اگه وجود نداره)
            if [ ! -f ".env" ]; then
              cp .env.example .env
              php artisan key:generate
            fi
            
            # اجرای مایگریشن‌ها
            php artisan migrate --force
            
            # پاک کردن و بازسازی کش
            php artisan optimize:clear
            php artisan optimize
            
            # تنظیم دسترسی‌ها
            chown -R u573287159:apache /home/u573287159/domains/cardifygroup.com/public_html/api/mazorya-back
            chmod -R 755 /home/u573287159/domains/cardifygroup.com/public_html/api/mazorya-back
            chmod -R 775 storage bootstrap/cache
            
            echo "✅ Laravel deployment complete!"